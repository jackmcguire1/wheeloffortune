version: v2
clean: true
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: gen
    opt:
      - paths=source_relative
      - simple
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/src/gen
    opt: target=ts
